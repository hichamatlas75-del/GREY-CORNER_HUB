<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direction • Grey Corner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0f14;
            color: #e2e8f0;
            min-height: 100vh;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-card { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
        
        .card-pro {
            position: relative;
            background: #1a1f26;
            border: 1px solid rgba(255,255,255,0.03);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-pro:hover {
            transform: translateX(6px);
            background: #222831;
            border-color: rgba(255,255,255,0.1);
        }

        .card-pro::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
        }

        .border-personnel::before { background-color: #3b82f6; }
        .border-planning::before { background-color: #a855f7; }
        .border-menu::before { background-color: #10b981; }
        .border-ramadan::before { background-color: #f59e0b; }
        .border-tech::before { background-color: #ef4444; }
        .border-cost::before { background-color: #06b6d4; }
        .border-finance::before { background-color: #64748b; }

        .icon-box { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* Style spécifique pour le bloc Réputation */
        .reputation-box {
            background: linear-gradient(145deg, rgba(251, 191, 36, 0.05) 0%, rgba(129, 140, 248, 0.05) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="antialiased text-slate-300">

    <div class="flex flex-col items-center py-12 px-6">
        <div class="w-full max-w-[460px]">
            
            <header class="text-center mb-10 animate-card" style="animation-delay: 0ms">
                <img src="LOGO.jpg" alt="Logo" class="w-20 h-20 mx-auto mb-6 rounded-2xl grayscale border border-white/5 shadow-2xl">
                <h1 class="text-xl font-extrabold tracking-[0.25em] text-white uppercase">Direction Hub</h1>
                <p class="text-[10px] text-slate-500 uppercase tracking-[0.3em] mt-2 font-medium">Système de Gestion Opérationnelle</p>
            </header>

            <nav class="flex flex-col gap-3">
                
                <a href="https://personnelgreycorner.pages.dev/" class="animate-card card-pro border-personnel group flex items-center p-4 rounded-xl" style="animation-delay: 100ms">
                    <div class="w-11 h-11 flex items-center justify-center icon-box rounded-lg mr-4 text-blue-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </div>
                    <div class="flex flex-col flex-grow">
                        <span class="text-[13px] font-bold text-white uppercase tracking-wide">Gestion RH</span>
                        <span class="text-[10px] text-slate-500 uppercase">Contrats & Staff</span>
                    </div>
                </a>

                <a href="https://grey-corner-app.pages.dev/" class="animate-card card-pro border-planning group flex items-center p-4 rounded-xl" style="animation-delay: 200ms">
                    <div class="w-11 h-11 flex items-center justify-center icon-box rounded-lg mr-4 text-purple-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                    <div class="flex flex-col flex-grow">
                        <span class="text-[13px] font-bold text-white uppercase tracking-wide text-purple-200">Plannings Hebdo</span>
                        <span class="text-[10px] text-slate-500 uppercase">Opérations</span>
                    </div>
                </a>

                <div class="animate-card reputation-box p-4 rounded-2xl flex flex-col gap-3 my-2" style="animation-delay: 300ms">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] ml-1">Espace Réputation</span>
                    <div class="grid grid-cols-2 gap-3">
                        <a href="https://search.google.com/local/reviews?placeid=ChIJs_pxZQCLnw0RcXRA2bTib5k&sort=1" target="_blank" class="bg-yellow-500/10 border border-yellow-500/20 p-3 rounded-xl flex flex-col items-center gap-2 hover:bg-yellow-500/20 transition-all group">
                            <svg class="w-6 h-6 text-yellow-500 group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                            <span class="text-[11px] font-black text-white uppercase">Voir Avis</span>
                        </a>
                        <a href="https://gemini.google.com/app?prompt=Agis%20en%20tant%20que%20gérant%20du%20Grey%20Corner%20Fès.%20Rédige%20une%20réponse%20chaleureuse%20et%20cosy%20à%20cet%20avis%20client%20:" target="_blank" class="bg-indigo-500/10 border border-indigo-500/20 p-3 rounded-xl flex flex-col items-center gap-2 hover:bg-indigo-500/20 transition-all group">
                            <svg class="w-6 h-6 text-indigo-400 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                            <span class="text-[11px] font-black text-white uppercase tracking-tighter text-center">Générer Réponse</span>
                        </a>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <a href="https://greycorner.pages.dev/" class="card-pro border-menu p-4 rounded-xl animate-card" style="animation-delay: 400ms">
                        <span class="text-[12px] font-bold text-white uppercase block mb-1">Carte</span>
                        <span class="text-[9px] text-emerald-400 uppercase font-medium">Menu Officiel</span>
                    </a>
                    <a href="https://ramadan-greycorner.pages.dev/" class="card-pro border-ramadan p-4 rounded-xl animate-card" style="animation-delay: 500ms text-amber-500">
                        <span class="text-[12px] font-bold text-white uppercase block mb-1">Ramadan</span>
                        <span class="text-[9px] text-amber-500 uppercase font-medium">Offres Spéciales</span>
                    </a>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <a href="https://fiche-technique.pages.dev/" class="card-pro border-tech p-4 rounded-xl animate-card" style="animation-delay: 600ms">
                        <span class="text-[11px] font-bold text-white uppercase block mb-1">Fiches Tech</span>
                        <span class="text-[9px] text-red-500 uppercase font-medium">Standards</span>
                    </a>
                    <a href="https://costfood.pages.dev/" class="card-pro border-cost p-4 rounded-xl animate-card" style="animation-delay: 700ms text-cyan-500">
                        <span class="text-[11px] font-bold text-white uppercase block mb-1">Analytique</span>
                        <span class="text-[9px] text-cyan-500 uppercase font-medium">Marge & Profit</span>
                    </a>
                </div>

                <a href="https://depenses-grey-corner.pages.dev/" class="animate-card card-pro border-finance group flex items-center p-4 rounded-xl" style="animation-delay: 800ms">
                    <div class="w-11 h-11 flex items-center justify-center icon-box rounded-lg mr-4 text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2"></path></svg>
                    </div>
                    <div class="flex flex-col flex-grow text-left">
                        <span class="text-[13px] font-bold text-white uppercase tracking-wide">Dépenses</span>
                        <span class="text-[10px] text-slate-500 uppercase">Suivi Achats</span>
                    </div>
                </a>

            </nav>

            <footer class="mt-16 text-center animate-card" style="animation-delay: 900ms text-slate-800">
                <p class="text-slate-800 text-[8px] font-bold uppercase tracking-[0.6em]">Management Secure Link &bull; 2026</p>
            </footer>

        </div>
    </div>

</body>
</html>
