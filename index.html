<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grey Corner • Executive Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0f172a;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            overflow-x: hidden;
        }

        .font-display {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Animated Background Blobs */
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.15) 100%);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            animation: move 25s infinite alternate;
        }

        .blob-2 {
            background: linear-gradient(180deg, rgba(244, 63, 94, 0.1) 0%, rgba(251, 146, 60, 0.1) 100%);
            width: 600px;
            height: 600px;
            right: -100px;
            top: -100px;
            animation-duration: 30s;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%) scale(1); }
            to { transform: translate(10%, 10%) scale(1.1); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px) scale(1.02);
        }

        .pulse-live {
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .animate-slide-in {
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .color-shadow-emerald:hover { box-shadow: 0 20px 40px -15px rgba(16, 185, 129, 0.3); }
        .color-shadow-blue:hover { box-shadow: 0 20px 40px -15px rgba(59, 130, 246, 0.3); }
        .color-shadow-amber:hover { box-shadow: 0 20px 40px -15px rgba(245, 158, 11, 0.3); }
        .color-shadow-rose:hover { box-shadow: 0 20px 40px -15px rgba(244, 63, 94, 0.3); }
        .color-shadow-indigo:hover { box-shadow: 0 20px 40px -15px rgba(99, 102, 241, 0.3); }
        .color-shadow-violet:hover { box-shadow: 0 20px 40px -15px rgba(139, 92, 246, 0.3); }
        .color-shadow-teal:hover { box-shadow: 0 20px 40px -15px rgba(20, 184, 166, 0.3); }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client"
      }
    }
    </script>
</head>
<body class="min-h-screen text-white relative">
    <div class="blob"></div>
    <div class="blob blob-2"></div>
    
    <div id="root"></div>

    <script type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';

        const NAV_ITEMS = [
          {
            id: 'personnel',
            title: 'Gestion du Personnel',
            subtitle: 'Ressources Humaines & Accès Staff',
            href: 'https://personnelgreycorner.pages.dev/',
            color: 'emerald',
            category: 'RH',
            icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`
          },
          {
            id: 'menu-principal',
            title: 'Menu Principal',
            subtitle: 'Consultation de la Carte Officielle',
            href: 'https://greycorner.pages.dev/',
            color: 'blue',
            category: 'CLIENTS',
            icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>`
          },
          {
            id: 'menu-ramadan',
            title: 'Campagnes Ramadan',
            subtitle: 'Offres Saisonnières Spéciales',
            href: 'https://ramadan-greycorner.pages.dev/',
            color: 'amber',
            category: 'MARKETING',
            icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`
          },
          {
            id: 'fiches-techniques',
            title: 'Fiches Techniques',
            subtitle: 'Recettes & Processus Cuisine',
            href: 'https://fiche-technique.pages.dev/',
            color: 'rose',
            category: 'CUISINE',
            icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>`
          },
          {
            id: 'portail-staff',
            title: 'Portail Opérations',
            subtitle: 'Planning & Coordination Quotidienne',

            color: 'indigo',
            category: 'ADMIN',
            icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="m9 16 2 2 4-4"/></svg>`
          },
          {
            id: 'cost-food',
            title: 'Analytique Cost Food',
            subtitle: 'Contrôle des Marges & Stocks',
            href: 'https://costfood.pages.dev/',
            color: 'violet',
            category: 'FINANCE',
            icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></svg>`
          },
          {
            id: 'depenses',
            title: 'Suivi Trésorerie',
            subtitle: 'Journal des Achats & Dépenses',
            href: 'https://depenses-grey-corner.pages.dev/',
            color: 'teal',
            category: 'COMPTA',
            icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`
          }
        ];

        const COLOR_CLASSES = {
          emerald: 'text-emerald-400 bg-emerald-400/10 border-emerald-400/20 shadow-emerald-400/20',
          blue: 'text-blue-400 bg-blue-400/10 border-blue-400/20 shadow-blue-400/20',
          amber: 'text-amber-400 bg-amber-400/10 border-amber-400/20 shadow-amber-400/20',
          rose: 'text-rose-400 bg-rose-400/10 border-rose-400/20 shadow-rose-400/20',
          indigo: 'text-indigo-400 bg-indigo-400/10 border-indigo-400/20 shadow-indigo-400/20',
          violet: 'text-violet-400 bg-violet-400/10 border-violet-400/20 shadow-violet-400/20',
          teal: 'text-teal-400 bg-teal-400/10 border-teal-400/20 shadow-teal-400/20',
        };

        const ModuleCard = ({ item, index }) => {
          const colors = COLOR_CLASSES[item.color] || COLOR_CLASSES.indigo;
          
          return React.createElement('a', {
            href: item.href,
            target: '_blank',
            rel: 'noopener noreferrer',
            className: `glass-card group flex items-center p-6 rounded-[2rem] animate-slide-in color-shadow-${item.color}`,
            style: { animationDelay: `${index * 100}ms` }
          },
            React.createElement('div', { 
              className: `w-16 h-16 flex items-center justify-center rounded-2xl transition-all duration-500 group-hover:scale-110 group-hover:rotate-3 shrink-0 ${colors}`,
              dangerouslySetInnerHTML: { __html: item.icon }
            }),
            React.createElement('div', { className: 'ml-6 flex-grow' },
              React.createElement('div', { className: 'flex items-center gap-2 mb-1' },
                React.createElement('span', { className: `text-[9px] font-black uppercase tracking-[0.2em] px-2 py-0.5 rounded-md bg-white/10 text-white/70` }, item.category)
              ),
              React.createElement('h3', { className: 'text-lg font-display font-bold text-white group-hover:text-indigo-300 transition-colors' }, item.title),
              React.createElement('p', { className: 'text-sm text-white/40 font-medium' }, item.subtitle)
            ),
            React.createElement('div', { className: 'ml-4 opacity-0 group-hover:opacity-100 transition-all duration-500 translate-x-2 group-hover:translate-x-0' },
              React.createElement('svg', { className: 'w-6 h-6 text-white/20 group-hover:text-white', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5' },
                React.createElement('path', { d: 'M5 12h14M12 5l7 7-7 7', strokeLinecap: 'round', strokeLinejoin: 'round' })
              )
            )
          );
        };

        const App = () => {
          const [time, setTime] = useState(new Date());

          useEffect(() => {
            const timer = setInterval(() => setTime(new Date()), 1000);
            return () => clearInterval(timer);
          }, []);

          return React.createElement('div', { className: 'max-w-2xl mx-auto px-6 py-12 md:py-24' },
            // Header
            React.createElement('header', { className: 'flex flex-col items-center text-center mb-16 animate-slide-in' },
              React.createElement('div', { className: 'relative mb-8' },
                React.createElement('div', { className: 'w-24 h-24 bg-white/5 rounded-[2.5rem] p-0.5 backdrop-blur-3xl border border-white/10' },
                  React.createElement('img', { 
                    src: 'https://ui-avatars.com/api/?name=GC&background=fff&color=0f172a&bold=true', 
                    className: 'w-full h-full rounded-[2.3rem] object-cover'
                  })
                ),
                React.createElement('div', { className: 'absolute -bottom-2 -right-2 bg-emerald-500 px-3 py-1 rounded-full flex items-center gap-2 shadow-xl shadow-emerald-500/20' },
                  React.createElement('div', { className: 'w-2 h-2 bg-white rounded-full pulse-live' }),
                  React.createElement('span', { className: 'text-[10px] font-black text-white uppercase tracking-widest' }, 'Live')
                )
              ),
              React.createElement('h1', { className: 'text-4xl md:text-5xl font-display font-black tracking-tight mb-4' }, 
                React.createElement('span', { className: 'text-white' }, 'Grey '),
                React.createElement('span', { className: 'text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-rose-400' }, 'Corner')
              ),
              React.createElement('p', { className: 'text-white/40 text-sm font-bold uppercase tracking-[0.3em]' }, 'Direction Executive • Portail de Gestion'),
              
              React.createElement('div', { className: 'mt-8 flex items-center gap-4 text-white/60 bg-white/5 px-6 py-2 rounded-full border border-white/5' },
                React.createElement('span', { className: 'text-xs font-bold' }, time.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })),
                React.createElement('span', { className: 'w-1 h-1 bg-white/20 rounded-full' }),
                React.createElement('span', { className: 'text-xs font-black text-white' }, time.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }))
              )
            ),

            // Navigation Grid
            React.createElement('nav', { className: 'grid grid-cols-1 gap-5' },
              NAV_ITEMS.map((item, idx) => 
                React.createElement(ModuleCard, { key: item.id, item, index: idx })
              )
            ),

            // Footer
            React.createElement('footer', { className: 'mt-24 text-center border-t border-white/5 pt-12 opacity-30 animate-slide-in', style: { animationDelay: '800ms' } },
              React.createElement('p', { className: 'text-[10px] font-black uppercase tracking-[0.5em] text-white mb-4' }, 'Propriété Exclusive de Grey Corner © 2025'),
              React.createElement('div', { className: 'flex justify-center gap-4' },
                React.createElement('span', { className: 'px-3 py-1 rounded-md border border-white/20 text-[8px] font-bold uppercase tracking-widest' }, 'Accès Niveau 5'),
                React.createElement('span', { className: 'px-3 py-1 rounded-md border border-white/20 text-[8px] font-bold uppercase tracking-widest' }, 'Encrypted Session')
              )
            )
          );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
