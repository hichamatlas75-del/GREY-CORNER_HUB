<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Grey Corner • iOS Hub</title>

<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<style>
:root{
  --bg:#f2f2f7;
  --card:#ffffff;
  --border:#e5e5ea;

  --text:#1c1c1e;
  --text-soft:#8e8e93;
  --blue:#007aff;

  --radius:18px;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* CONTAINER */
.page{
  max-width:560px;
  margin:auto;
  padding:20px;
  padding-bottom:110px;
}

/* HEADER */
.header{
  background:var(--card);
  border-radius:22px;
  padding:18px;
  margin-bottom:15px;
}

.logo{
  width:58px;
  border-radius:14px;
}

.title{
  font-size:18px;
  font-weight:600;
}

.subtitle{
  font-size:13px;
  color:var(--text-soft);
}

/* SECTION */
.section-title{
  font-size:13px;
  font-weight:500;
  color:var(--text-soft);
  margin:15px 0 8px;
}

/* CARDS */
.card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px;
  border-radius:16px;
  background:var(--card);
  margin-bottom:10px;
  transition:.2s;
}

.card:active{
  transform:scale(.97);
  background:#f0f0f5;
}

.card-left{
  display:flex;
  gap:12px;
  align-items:center;
}

.icon{
  width:36px;
  height:36px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f2f2f7;
  font-size:18px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.tile{
  padding:16px;
  border-radius:16px;
  background:var(--card);
  text-align:center;
  font-size:14px;
}

/* DOCK IOS */
.dock{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  max-width:520px;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(20px);
  border-radius:22px;
  display:flex;
  justify-content:space-around;
  padding:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.dock a{
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:11px;
  color:var(--text-soft);
  text-decoration:none;
}

.dock-icon{
  width:42px;
  height:42px;
  border-radius:12px;
  background:#f2f2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  margin-bottom:4px;
}

.dock a:active .dock-icon{
  transform:scale(.9);
}
</style>
</head>

<body>

<div class="page">

<!-- HEADER -->
<div class="header">
  <div style="display:flex;gap:12px;">
    <img src="LOGO.png" class="logo">
    <div>
      <div class="title">Grey Corner</div>
      <div class="subtitle">Management Hub • Fès</div>
    </div>
  </div>
</div>

<!-- APPS -->
<div class="section-title">Applications</div>

<a href="https://personnelgreycorner.pages.dev/" class="card">
  <div class="card-left">
    <div class="icon">👥</div>
    <div>
      <div>Gestion RH</div>
      <div class="subtitle">Staff & contrats</div>
    </div>
  </div>
  ➜
</a>

<a href="https://menugreycorner.pages.dev/" class="card">
  <div class="card-left">
    <div class="icon">📖</div>
    <div>
      <div>Menu</div>
      <div class="subtitle">Produits & carte</div>
    </div>
  </div>
  ➜
</a>

<!-- TOOLS -->
<div class="section-title">Outils</div>

<div class="grid">
  <a href="https://feuille-de-presence.pages.dev/" class="tile">Présence</a>
  <a href="https://pointage-greycorner.pages.dev/" class="tile">Pointage</a>
  <a href="https://fiche-technique.pages.dev/" class="tile">Fiche Tech</a>
  <a href="https://costfood.pages.dev/" class="tile">Food Cost</a>
</div>

<!-- FINANCE -->
<div class="section-title">Finance</div>

<a href="https://depenses-grey-corner.pages.dev/" class="card">
  <div class="card-left">
    <div class="icon">💰</div>
    <div>
      <div>Comptabilité</div>
      <div class="subtitle">Dépenses & achats</div>
    </div>
  </div>
  ➜
</a>

</div>

<!-- DOCK -->
<div class="dock">
  <a href="https://search.google.com/local/reviews?placeid=ChIJs_pxZQCLnw0RcXRA2bTib5k&sort=1">
    <div class="dock-icon">⭐</div>
    Avis
  </a>

  <a href="https://dashboard-presence.pages.dev/">
    <div class="dock-icon">📊</div>
    Live
  </a>

  <a href="https://greycorner.pages.dev/">
    <div class="dock-icon">🏠</div>
    Site
  </a>

  <a href="https://grey-corner-app.pages.dev/">
    <div class="dock-icon">📅</div>
    Planning
  </a>
</div>

</body>
</html>
