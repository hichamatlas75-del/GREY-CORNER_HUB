<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Grey Corner • Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>
:root{
  --bg:#0f111a;
  --card:rgba(255,255,255,.06);
  --card-hover:rgba(255,255,255,.10);
  --border:rgba(255,255,255,.12);

  --gold:#c9a84c;
  --blue:#5b9bff;
  --teal:#2dd4bf;

  --text:#f5f5f5;
  --text-soft:rgba(255,255,255,.6);

  --radius:18px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'DM Sans',sans-serif;
  background:linear-gradient(160deg,#0f111a,#1a1f33);
  color:var(--text);
}

/* CONTAINER */
.page{
  max-width:560px;
  margin:auto;
  padding:20px;
}

/* HEADER */
.header{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:20px;
  backdrop-filter:blur(20px);
  margin-bottom:15px;
}

.logo{
  width:60px;
  border-radius:16px;
}

.title{
  font-family:'Syne';
  font-weight:800;
  letter-spacing:.1em;
}

.subtitle{
  font-size:12px;
  color:var(--text-soft);
}

/* CARDS */
.card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px;
  border-radius:var(--radius);
  background:var(--card);
  border:1px solid var(--border);
  margin-bottom:10px;
  transition:.2s;
}

.card:hover{
  background:var(--card-hover);
}

.card-left{
  display:flex;
  gap:12px;
  align-items:center;
}

.icon{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:rgba(255,255,255,.08);
}

/* SECTIONS */
.section-title{
  font-size:11px;
  letter-spacing:.2em;
  color:var(--text-soft);
  margin:12px 0 8px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.tile{
  padding:14px;
  border-radius:var(--radius);
  background:var(--card);
  border:1px solid var(--border);
}

/* DOCK */
.dock{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(15,17,26,.9);
  backdrop-filter:blur(20px);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:8px;
}

.dock a{
  text-align:center;
  font-size:10px;
  color:var(--text-soft);
}
</style>
</head>

<body>

<div class="page">

<!-- HEADER -->
<div class="header">
  <div style="display:flex;gap:12px;">
    <img src="LOGO.png" class="logo">
    <div>
      <div class="title">GREY CORNER</div>
      <div class="subtitle">Management Hub • Fès</div>
    </div>
  </div>
</div>

<!-- APPS -->
<div class="section-title">APPLICATIONS</div>

<a href="https://personnelgreycorner.pages.dev/" class="card">
  <div class="card-left">
    <div class="icon">👥</div>
    <div>
      <div>Gestion RH</div>
      <div class="subtitle">Staff & contrats</div>
    </div>
  </div>
  →
</a>

<a href="https://menugreycorner.pages.dev/" class="card">
  <div class="card-left">
    <div class="icon">📖</div>
    <div>
      <div>Menu</div>
      <div class="subtitle">Produits & carte</div>
    </div>
  </div>
  →
</a>

<a href="https://ramadan-greycorner.pages.dev/" class="card">
  <div class="card-left">
    <div class="icon">🌙</div>
    <div>
      <div>Ramadan</div>
      <div class="subtitle">Offres ftour</div>
    </div>
  </div>
  →
</a>

<!-- TOOLS -->
<div class="section-title">OUTILS</div>

<div class="grid">
  <a href="https://feuille-de-presence.pages.dev/" class="tile">Présence</a>
  <a href="https://pointage-greycorner.pages.dev/" class="tile">Pointage</a>
  <a href="https://fiche-technique.pages.dev/" class="tile">Fiche Tech</a>
  <a href="https://costfood.pages.dev/" class="tile">Food Cost</a>
</div>

<!-- FINANCE -->
<div class="section-title">FINANCE</div>

<a href="https://depenses-grey-corner.pages.dev/" class="card">
  <div class="card-left">
    <div class="icon">💰</div>
    <div>
      <div>Comptabilité</div>
      <div class="subtitle">Dépenses & achats</div>
    </div>
  </div>
  →
</a>

</div>

<!-- DOCK -->
<div class="dock">
  <a href="#">Avis</a>
  <a href="#">Live</a>
  <a href="#">Menu</a>
  <a href="#">Planning</a>
</div>

</body>
</html>
