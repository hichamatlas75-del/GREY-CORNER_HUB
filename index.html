<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direction • Grey Corner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0c10;
            color: #e2e8f0;
            min-height: 100vh;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-card { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
        
        /* Style de base des cartes */
        .card-pro {
            position: relative;
            background: #161b22;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s ease;
            overflow: hidden;
        }
        .card-pro:hover {
            transform: translateX(4px);
            background: #1c2128;
            border-color: rgba(255,255,255,0.15);
        }

        /* Indicateurs colorés sobres sur le côté gauche */
        .card-pro::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            opacity: 0.7;
        }

        /* Palette Sobres Différenciées */
        .border-staff::before { background-color: #60a5fa; } /* Bleu administratif */
        .border-menu::before { background-color: #34d399; }  /* Vert émeraude mat */
        .border-ramadan::before { background-color: #fbbf24; } /* Ambre/Or */
        .border-tech::before { background-color: #f87171; }    /* Rouge brique */
        .border-app::before { background-color: #a78bfa; }     /* Violet sourd */
        .border-cost::before { background-color: #2dd4bf; }    /* Cyan profond */
        .border-finance::before { background-color: #94a3b8; } /* Slate (neutre) */

        /* Couleurs d'icônes subtiles */
        .icon-staff { color: #60a5fa; }
        .icon-menu { color: #34d399; }
        .icon-ramadan { color: #fbbf24; }
        .icon-tech { color: #f87171; }
        .icon-app { color: #a78bfa; }
        .icon-cost { color: #2dd4bf; }
        .icon-finance { color: #94a3b8; }
    </style>
</head>
<body class="antialiased">

    <div class="flex flex-col items-center py-12 px-6">
        <div class="w-full max-w-[460px]">
            
            <header class="text-center mb-12 animate-card" style="animation-delay: 0ms">
                <img src="LOGO.jpg" alt="Logo" class="w-20 h-20 mx-auto mb-6 rounded-xl grayscale opacity-90 border border-white/10 shadow-2xl">
                <h1 class="text-xl font-bold tracking-[0.3em] text-white uppercase">HUB DIRECTION</h1>
                <p class="text-[9px] text-slate-500 uppercase tracking-[0.4em] mt-2 font-semibold">Grey Corner • Management System</p>
            </header>

            <nav class="flex flex-col gap-3">
                
                <a href="https://personnelgreycorner.pages.dev/" class="animate-card card-pro border-staff group flex items-center p-4 rounded-lg" style="animation-delay: 100ms">
                    <div class="w-10 h-10 flex items-center justify-center bg-slate-800/40 rounded mr-4">
                        <svg class="w-5 h-5 icon-staff" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    </div>
                    <div class="flex flex-col flex-grow">
                        <span class="text-[13px] font-bold text-slate-200 uppercase tracking-wide">Gestion Personnel</span>
                        <span class="text-[10px] text-slate-500">Administration & Accès</span>
                    </div>
                    <svg class="w-4 h-4 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="3"></path></svg>
                </a>

                <a href="https://greycorner.pages.dev/" class="animate-card card-pro border-menu group flex items-center p-4 rounded-lg" style="animation-delay: 200ms">
                    <div class="w-10 h-10 flex items-center justify-center bg-slate-800/40 rounded mr-4">
                        <svg class="w-5 h-5 icon-menu" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    </div>
                    <div class="flex flex-col flex-grow">
                        <span class="text-[13px] font-bold text-slate-200 uppercase tracking-wide">Menu Principal</span>
                        <span class="text-[10px] text-slate-500">Édition Carte Officielle</span>
                    </div>
                    <svg class="w-4 h-4 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="3"></path></svg>
                </a>

                <a href="https://ramadan-greycorner.pages.dev/" class="animate-card card-pro border-ramadan group flex items-center p-4 rounded-lg" style="animation-delay: 300ms">
                    <div class="w-10 h-10 flex items-center justify-center bg-slate-800/40 rounded mr-4">
                        <svg class="w-5 h-5 icon-ramadan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </div>
                    <div class="flex flex-col flex-grow">
                        <span class="text-[13px] font-bold text-slate-200 uppercase tracking-wide">Offres Ramadan</span>
                        <span class="text-[10px] text-slate-500">Cartes Saisonnières</span>
                    </div>
                    <svg class="w-4 h-4 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="3"></path></svg>
                </a>

                <a href="https://fiche-technique.pages.dev/" class="animate-card card-pro border-tech group flex items-center p-4 rounded-lg" style="animation-delay: 400ms">
                    <div class="w-10 h-10 flex items-center justify-center bg-slate-800/40 rounded mr-4">
                        <svg class="w-5 h-5 icon-tech" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <div class="flex flex-col flex-grow">
                        <span class="text-[13px] font-bold text-slate-200 uppercase tracking-wide">Fiches Techniques</span>
                        <span class="text-[10px] text-slate-500">Recettes & Process</span>
                    </div>
                    <svg class="w-4 h-4 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="3"></path></svg>
                </a>

                <a href="https://costfood.pages.dev/" class="animate-card card-pro border-cost group flex items-center p-4 rounded-lg" style="animation-delay: 500ms">
                    <div class="w-10 h-10 flex items-center justify-center bg-slate-800/40 rounded mr-4">
                        <svg class="w-5 h-5 icon-cost" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 022 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    </div>
                    <div class="flex flex-col flex-grow">
                        <span class="text-[13px] font-bold text-slate-200 uppercase tracking-wide">Cost Food</span>
                        <span class="text-[10px] text-slate-500">Analyse de Rentabilité</span>
                    </div>
                    <svg class="w-4 h-4 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="3"></path></svg>
                </a>

                <a href="https://depenses-grey-corner.pages.dev/" class="animate-card card-pro border-finance group flex items-center p-4 rounded-lg" style="animation-delay: 600ms">
                    <div class="w-10 h-10 flex items-center justify-center bg-slate-800/40 rounded mr-4">
                        <svg class="w-5 h-5 icon-finance" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <div class="flex flex-col flex-grow">
                        <span class="text-[13px] font-bold text-slate-200 uppercase tracking-wide">Dépenses</span>
                        <span class="text-[10px] text-slate-500">Suivi Trésorerie</span>
                    </div>
                    <svg class="w-4 h-4 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="3"></path></svg>
                </a>

            </nav>

            <footer class="mt-16 text-center animate-card" style="animation-delay: 700ms">
                <p class="text-slate-700 text-[8px] font-bold uppercase tracking-[0.5em]">Management Interface &bull; 2026</p>
            </footer>

        </div>
    </div>

</body>
</html>
